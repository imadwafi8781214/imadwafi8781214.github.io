<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الملابس الكبير</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #222;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        nav {
            background-color: #333;
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            color: #ff6600;
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 30px;
            max-width: 1200px;
            margin: auto;
        }
        .product {
            background-color: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .product img {
            width: 100%;
            height: 250px;
            object-fit: cover;
        }
        .product-content {
            padding: 15px;
            text-align: center;
        }
        .product-content h2 {
            margin: 10px 0 5px;
            font-size: 1.3em;
        }
        .product-content p {
            color: #555;
            font-size: 0.95em;
        }
        .buy-button {
            display: inline-block;
            margin: 15px 0 10px;
            padding: 10px 20px;
            background-color: #ff6600;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .buy-button:hover {
            background-color: #e65c00;
        }
        footer {
            text-align: center;
            padding: 20px 0;
            background-color: #222;
            color: #fff;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <h1>متجر الملابس الكبير</h1>
    </header>

    <nav>
        <a href="#">الرئيسية</a>
        <a href="#">رجالي</a>
        <a href="#">نسائي</a>
        <a href="#">أطفال</a>
        <a href="#">تواصل معنا</a>
    </nav>

    <div class="products">
        <div class="product">
            <img src="images/shirt1.png" alt="قميص رجالي">
            <div class="product-content">
                <h2>قميص رجالي</h2>
                <p>قميص عالي الجودة من أفضل الأقمشة.</p>
                <a href="#" class="buy-button">اشتر الآن</a>
            </div>
        </div>
        <div class="product">
            <img src="images/shirt2.png" alt="قميص نسائي">
            <div class="product-content">
                <h2>قميص نسائي</h2>
                <p>تصميم عصري يناسب كل الأذواق.</p>
                <a href="#" class="buy-button">اشتر الآن</a>
            </div>
        </div>
        <div class="product">
            <img src="images/jacket.png" alt="جاكيت شتوي">
            <div class="product-content">
                <h2>جاكيت شتوي</h2>
                <p>جاكيت دافئ وأنيق لجميع الفصول.</p>
                <a href="#" class="buy-button">اشتر الآن</a>
            </div>
        </div>
        <div class="product">
            <img src="images/pants.png" alt="بنطلون كلاسيكي">
            <div class="product-content">
                <h2>بنطلون كلاسيكي</h2>
                <p>بنطلون أنيق مريح للمناسبات الرسمية.</p>
                <a href="#" class="buy-button">اشتر الآن</a>
            </div>
        </div>
