<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StreetWear Brand</title>
<style>
body {
    margin:0;
    font-family: Arial;
    background:black;
    color:white;
}

header {
    display:flex;
    justify-content:space-between;
    padding:20px;
    background:#111;
}

.logo {
    font-size:24px;
    font-weight:bold;
}

nav a {
    color:white;
    margin:0 10px;
    text-decoration:none;
}

.hero {
    text-align:center;
    padding:100px 20px;
}

.hero h1 {
    font-size:50px;
}

.products {
    display:flex;
    justify-content:center;
    gap:20px;
    padding:40px;
    flex-wrap:wrap;
}

.card {
    background:#111;
    padding:20px;
    border-radius:10px;
    width:200px;
    text-align:center;
}

.card img {
    width:100%;
    border-radius:10px;
}

footer {
    text-align:center;
    padding:20px;
    background:#111;
}
</style>
</head>

<body>

<header>
    <div class="logo">SLICK</div>
    <nav>
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">Contact</a>
    </nav>
</header>

<section class="hero">
    <h1>Your Style. Your Rules.</h1>
    <p>New collection is live 🔥</p>
</section>

<section class="products">

    <div class="card">
        <img src="https://via.placeholder.com/200">
        <h3>T-Shirt Black</h3>
        <p>$25</p>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200">
        <h3>Hoodie</h3>
        <p>$45</p>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/200">
        <h3>Cap</h3>
        <p>$15</p>
    </div>

</section>

<footer>
    <p>© 2026 SLICK Brand</p>
</footer>

</body>
</html>
